<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimmy's Little Planet Helper Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="gameArea">
    <img id="background" src="images/town.jpg" alt="Game background" />

    <div id="hud">
      <div class="hud-box">
        <strong id="levelTitle">Level 1: Town Clean-Up</strong>
        <div class="progress"><div id="progressFill"></div></div>
        <span id="percentText">0%</span>
      </div>
      <div class="hud-box small">⭐ <span id="scoreText">0</span></div>
      <button id="pauseBtn">Pause</button>
    </div>

    <div id="messageBubble"></div>

    <img id="kimmy" src="images/kimmy.png" alt="Kimmy" />
    <img id="sack" src="images/sack.png" alt="Magic sack" />

    <div id="startScreen" class="screen">
      <h1>Kimmy’s Clean-Up Adventure</h1>
      <p>Tap the rubbish before it reaches the drain or water. Don’t tap the animals!</p>
      <button id="startBtn">Start</button>
    </div>

    <div id="levelScreen" class="screen hidden">
      <h1 id="levelCompleteTitle">Level Complete!</h1>
      <p id="levelCompleteText">Great job!</p>
      <p id="levelStats"></p>
      <button id="nextLevelBtn">Next Level</button>
    </div>

    <div id="winScreen" class="screen hidden">
      <h1>🌎 Little Planet Helper 🌎</h1>
      <p id="finalStats">Small actions make a big difference!</p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
