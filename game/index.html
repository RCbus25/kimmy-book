<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimmy's Beach Clean-Up Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrap">
    <section id="gameArea">
      <img src="images/beach.jpg" id="beach" alt="Beach background" />

      <div class="top-bar">
        <div class="progress-wrap">
          <span>Magic Sack</span>
          <div class="progress">
            <div id="progressFill"></div>
          </div>
          <span id="percentText">0%</span>
        </div>
        <button id="restartBtn">Play Again</button>
      </div>

      <div id="encouragement"></div>

      <img src="images/kimmy.png" id="kimmy" alt="Kimmy" />
      <img src="images/sack.png" id="sack" alt="Kimmy's magic sack" />
      <img src="images/turtle.png" id="turtle" alt="Happy sea turtle" />

      <div id="message">
        <h1>Kimmy's Beach Clean-Up</h1>
        <p>Tap the rubbish to help fill Kimmy's magic sack.</p>
        <button id="startBtn">Start Cleaning</button>
      </div>

      <div id="winMessage">
        <h1>🌎 Little Planet Helper 🌎</h1>
        <p>Small actions make a big difference!</p>
        <button id="playAgainBtn">Play Again</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
