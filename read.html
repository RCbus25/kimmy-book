<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Read Kimmy and the Little Planet Helpers</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #f5f1e8;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #444;
}

.header {
  padding: 28px 20px 20px;
}

.header img {
  max-width: 220px;
  width: 70%;
}

.intro {
  font-size: 18px;
  color: #555;
  margin-top: 12px;
}

.book-page {
  margin: 0 auto 26px;
  width: 100%;
}

.book-page img {
  width: 95%;
  max-width: 900px;
  border-radius: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.14);
}

.footer {
  padding: 50px 20px 70px;
  color: #555;
}

.footer h2 {
  font-size: 28px;
  margin-bottom: 10px;
  color: #444;
}

.footer p {
  font-size: 17px;
  margin-bottom: 12px;
}

.resource-note {
  font-size: 14px;
  color: #777;
  margin-bottom: 26px;
}

.resource-button {
  background: #ff914d;
  color: white;
  text-decoration: none;
  padding: 15px 26px;
  border-radius: 30px;
  font-weight: bold;
  display: block;
  width: fit-content;
  margin: 22px auto;
  text-align: center;
}

.amazon-button {
  background: #f0c14b;
  color: #111;
  text-decoration: none;
  padding: 15px 26px;
  border-radius: 30px;
  font-weight: bold;
  display: block;
  width: fit-content;
  margin: 22px auto;
  text-align: center;
}

.footer a:hover {
  opacity: 0.9;
}

.small {
  margin-top: 32px;
  font-size: 13px;
  color: #777;
}

/* Basic image protection */
img {
  -webkit-user-drag: none;
  user-select: none;
  pointer-events: none;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="header">
  <img src="little-planet-books-logo.png" alt="Little Planet Books Logo">
  <div class="intro">
    Free Read-Aloud Edition
  </div>
</div>

<div id="book-container"></div>

<div class="footer">
  <h2>Free Educator Resources</h2>

  <p>
    Download the complete printable activity pack inspired by
    <strong>Kimmy and the Little Planet Helpers</strong>.
  </p>

  <p class="resource-note">
    Suitable for ages 3–8 • Home • Childcare • Classroom use
  </p>

<a class="resource-button"
   href="Book1-Educator-Pack/BK1-Educator-Pack.pdf"
   target="_blank"
   onclick="gtag('event', 'educator_pack_download', {
     'resource_name': 'Book 1 Educator Pack',
     'resource_type': 'PDF'
   });">
  Download Free Educator Activity Pack
</a>

<a class="amazon-button"
   href="https://www.amazon.com.au/dp/B0GWD98S82"
   target="_blank"
   onclick="gtag('event', 'amazon_book_click', {
     'book_title': 'Kimmy and the Little Planet Helpers Book 1',
     'destination': 'Amazon AU'
   });">
  View the Book on Amazon
</a>

  <div class="small">
    © Little Planet Books
  </div>
</div>

<script>
const totalPages = 37;

const container = document.getElementById('book-container');

for (let i = 1; i <= totalPages; i++) {
  let pageNumber = i.toString().padStart(2, '0');

  let pageDiv = document.createElement('div');
  pageDiv.className = 'book-page';

  let img = document.createElement('img');
  img.src = `book-webp/Image${pageNumber}.webp`;
  img.alt = `Kimmy and the Little Planet Helpers page ${i}`;
  img.loading = "lazy";

  pageDiv.appendChild(img);
  container.appendChild(pageDiv);
}
</script>

</body>
</html>
